name: build

on:
  push:
    tags: ['v*']
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2png_selftest.exe

      - name: Deploy Qt runtime
        run: |
          N=img2png-${{ github.ref_name }}-windows-x64
          mkdir -p pkg/$N
          cp build/img2png.exe build/img2png-gui.exe pkg/$N/
          WDEP=$(command -v windeployqt || command -v windeployqt6)
          "$WDEP" --release --no-translations \
            --no-system-d3d-compiler --no-opengl-sw "pkg/$N/img2png-gui.exe"
          rm -rf pkg/$N/tls pkg/$N/networkinformation \
                 pkg/$N/generic pkg/$N/Qt6Network.dll
          # the exes link these dynamically, so ship them - otherwise the
          # package only starts on machines that already have MSYS2/MinGW
          for d in libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll; do
            cp "/mingw64/bin/$d" "pkg/$N/"
          done

      # zip here rather than in the release job: the archive is then just
      # another artifact file, like the tarballs the other jobs upload
      - name: Package (zip)
        shell: pwsh
        run: |
          $n = "img2png-${{ github.ref_name }}-windows-x64"
          Compress-Archive -Path "pkg/$n" -DestinationPath "$n.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: img2png-${{ github.ref_name }}-windows-x64
          path: img2png-${{ github.ref_name }}-windows-x64.zip

  # ------------------------------------------------------------------
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ qt6-base-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2png_selftest

      - name: Package (CLI + GUI with bundled Qt libs)
        run: |
          V=${{ github.ref_name }}
          D=img2png-$V-linux-x64
          mkdir -p $D/lib $D/plugins/platforms $D/plugins/imageformats
          cp build/img2png $D/
          cp build/img2png-gui $D/
          # bundle the Qt libraries the GUI links against ...
          for lib in $(ldd build/img2png-gui | grep -oE '/[^ ]*libQt6[^ ]*\.so[^ ]*'); do
            cp "$lib" $D/lib/
          done
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqxcb.so $D/plugins/platforms/ 2>/dev/null || true
          for p in /usr/lib/x86_64-linux-gnu/qt6/plugins/imageformats/*.so; do
            [ -e "$p" ] && cp "$p" $D/plugins/imageformats/
          done

          # ... and their own dependencies.  libicu's soname is versioned
          # (libicuuc.so.70 on 22.04, .74 on 24.04), so relying on the distro
          # copy breaks on any other release.  The graphics/driver stack is
          # skipped on purpose: bundling it would couple us to Mesa, and the
          # .deb declares those instead.
          for round in 1 2 3; do
            before=$(ls $D/lib | wc -l)
            for target in $D/img2png $D/img2png-gui $D/lib/*.so* $D/plugins/*/*.so; do
              for so in $(ldd "$target" 2>/dev/null | awk '/=>/ {print $3}' | grep '^/'); do
                base=$(basename "$so")
                case "$base" in
                  libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|ld-linux*) continue ;;
                  libstdc++.so.*|libgcc_s.so.*) continue ;;
                  libGL*.so.*|libEGL*.so.*|libGLX*.so.*|libOpenGL*.so.*) continue ;;
                  libX*.so.*|libxcb*.so.*|libxkbcommon*.so.*) continue ;;
                  libdrm*.so.*|libgbm*.so.*) continue ;;
                esac
                [ -e "$D/lib/$base" ] || cp "$so" "$D/lib/" 2>/dev/null || true
              done
            done
            [ "$before" = "$(ls $D/lib | wc -l)" ] && break
          done

          cat > $D/img2png-gui.sh << 'EOS'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="$DIR/plugins"
          exec "$DIR/img2png-gui" "$@"
          EOS
          chmod +x $D/img2png-gui.sh $D/img2png $D/img2png-gui
          tar -czf $D.tar.gz $D

          # ---- Debian package: the same files, installed under /opt/img2png ----
          VER="${V#v}"
          case "$VER" in
            [0-9]*) ;;
            *) VER=0.0.0 ;;
          esac
          P=img2png_${VER}_amd64
          rm -rf $P
          mkdir -p $P/DEBIAN $P/opt/img2png $P/usr/bin $P/usr/share/applications
          cp -a $D/. $P/opt/img2png/
          cat > $P/usr/bin/img2png << 'EOS'
          #!/bin/sh
          exec /opt/img2png/img2png "$@"
          EOS
          cat > $P/usr/bin/img2png-gui << 'EOS'
          #!/bin/sh
          export LD_LIBRARY_PATH="/opt/img2png/lib:$LD_LIBRARY_PATH"
          export QT_PLUGIN_PATH="/opt/img2png/plugins"
          exec /opt/img2png/img2png-gui "$@"
          EOS
          cat > $P/usr/share/applications/img2png.desktop << 'EOS'
          [Desktop Entry]
          Type=Application
          Name=img2png
          Comment=Convert BMP/TGA/PNM/ICO/JPEG/PNG/GIF/QOI/WebP/TIFF/HEIF/AVIF images to PNG
          Exec=img2png-gui
          Terminal=false
          Categories=Graphics;Utility;
          EOS

          # Depends: ask dpkg who owns each shared object we still need from the
          # system (anything under /opt/img2png/lib is shipped by us)
          : > /tmp/deps.txt
          for target in $P/opt/img2png/img2png $P/opt/img2png/img2png-gui \
                        $P/opt/img2png/lib/*.so* $P/opt/img2png/plugins/*/*.so; do
            for so in $(ldd "$target" 2>/dev/null | awk '/=>/ {print $3}' | grep '^/'); do
              [ -e "$P/opt/img2png/lib/$(basename "$so")" ] && continue
              dpkg -S "$so" 2>/dev/null | head -1 | cut -d: -f1 >> /tmp/deps.txt
            done
          done
          deps=$(sort -u /tmp/deps.txt | grep -v '^$' | paste -sd, - | sed 's/,/, /g')
          [ -n "$deps" ] || deps=libc6

          cat > $P/DEBIAN/control << EOS
          Package: img2png
          Version: $VER
          Section: graphics
          Priority: optional
          Architecture: amd64
          Maintainer: Hanson418 <https://github.com/Hanson418>
          Depends: $deps
          Installed-Size: $(du -sk $P/opt | cut -f1)
          Description: lossless multi-format image to PNG converter
           Converts BMP, TGA, PNM, ICO, JPEG, PNG, GIF, QOI, WebP, TIFF, HEIF and
           AVIF images to PNG, with a CLI and a Qt GUI.  Bit depth and metadata
           (EXIF, ICC, XMP, resolution) are preserved.  Qt and the versioned
           runtime libraries are bundled under /opt/img2png.
          EOS
          chmod 0755 $P/usr/bin/img2png $P/usr/bin/img2png-gui
          dpkg-deb --root-owner-group --build $P
          rm -rf $P

      - uses: actions/upload-artifact@v4
        with:
          name: img2png-${{ github.ref_name }}-linux-x64
          path: |
            img2png-${{ github.ref_name }}-linux-x64.tar.gz
            img2png_*_amd64.deb

  # ------------------------------------------------------------------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          brew install cmake ninja qt

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ./build/img2png_selftest

      - name: Package (CLI + GUI app bundle)
        run: |
          V=${{ github.ref_name }}
          D=img2png-$V-macos
          mkdir -p $D
          cp build/img2png $D/
          # the GUI is built as an .app bundle on macOS; deploy Qt into it
          ls build/*.app && macdeployqt build/*.app -no-strip
          cp -R build/*.app $D/
          tar -czf $D.tar.gz $D

          # ---- disk image with the usual drag-to-Applications layout ----
          # unsigned, so the first launch needs right-click > Open
          STAGE=$D-dmg
          rm -rf $STAGE
          mkdir -p $STAGE
          # ditto (not cp) keeps the .app bundle's symlinks and attributes intact
          ditto "$D" "$STAGE"
          ln -s /Applications $STAGE/Applications
          hdiutil create -volname "img2png $V" -srcfolder "$STAGE" \
            -ov -format UDZO "$D.dmg"
          rm -rf $STAGE

      - uses: actions/upload-artifact@v4
        with:
          name: img2png-${{ github.ref_name }}-macos
          path: |
            img2png-${{ github.ref_name }}-macos.tar.gz
            img2png-${{ github.ref_name }}-macos.dmg

  # ------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      # The release body is left to the maintainer: release notes are written
      # locally (RELEASE_NOTES_<tag>.md) and pasted in by hand.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
